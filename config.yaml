# =========================================================
#  批改模拟器 · 配置文件
#  用「记事本」打开就能改，改完保存，关掉程序重开即生效
# =========================================================

ai:
  # 接口提供方：zhipu（智谱 GLM）
  provider: "zhipu"
  # 智谱的 OpenAI 兼容接口地址（国内版，一般不用改）
  #   国际版换成 https://api.z.ai/api/paas/v4
  #   编程套餐专用换成 https://open.bigmodel.cn/api/coding/paas/v4
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  # 默认模型；想换 glm-4.6 / glm-4.5-flash 等，改这一行即可
  model: "glm-4.5-air"
  # .env 文件里存放密钥的变量名（一般不用改）
  api_key_env: "ZHIPU_API_KEY"
  # 单次请求最长等待秒数
  timeout_seconds: 180
  # 请求失败自动重试次数
  max_retries: 3
  # ---- 下面是智谱专属参数，一般保持默认即可 ----
  # 温度上限：智谱要求 0~1，超出会自动压回上限（出题/写答案用到）
  temperature_max: 1.0
  # 单次回复最大长度：够写完整批答卷即可
  max_tokens: 8192
  # 是否强制 JSON 输出：智谱部分模型不支持，默认关闭（靠提示词 + 本地兜底解析）
  json_mode: false
  # 是否关闭思维链：disabled=关闭（更快、更稳，推荐）/ enabled=开启 / 删掉这行=不传该参数
  thinking: "disabled"
  # 温度为 0 时改用贪心解码（do_sample=false），彻底锁死随机性——阅卷稳定性关键，保持 true
  greedy_when_zero: true

question:
  subject: "地理"
  # 题目分值候选，出题时随机选一个。
  # 【8 分 = 4 个采分点，10 分 = 5 个采分点】题目难度已按高考水平抬高。
  score_options: [8, 10]
  # 每个采分点几分
  point_score: 2
  # 【候补采分点】在"分值 ÷ 每点分值"的基础上，再多出几个采分点。
  # 例如 8 分的题本该 4 个点，这里设 1 就生成 5 个点：
  # 多出来的是【候补】——同一设问下另一条也正确的答法，
  # 留给你在下一步"评分细则"里挑掉不想要的那一条。
  # ⚠ 总分仍然是 8 分：学生把 5 个点全答对，也只能拿 8 分（多答不加分）。
  #   设 0 就退回旧行为（点数正好等于 分值 ÷ 每点分值）。
  spare_points: 1
  # 出题的随机程度，0~1（智谱上限为 1），越高题目越多样
  temperature: 1.0
  # ---- 出题主题：自然题 / 人文题 怎么轮换 ----
  # 【2026-10-02 用户要求】之前连着跑出来的都是人文大题（产业转移、都市农业
  #   那一类），自然地理的题必须补上——自然类在高考里和人文类各占半壁江山。
  # 可选值：
  #   auto（默认）= 两类【交替】出：这次自然、下次人文，不会连着出人文题
  #   natural      = 只出自然地理的题（地貌／水文／气候／土壤植被／生态过程）
  #   human        = 只出人文地理的题（区位／产业转移／人口／交通）
  # 程序会把上一次出的类型记在 data/last_topic_type.txt 里，用来决定下一次。
  topic_type: auto
  # ---- 出题后的"答案泄漏"闸门（2026-09-29 新增，建议保持开启）----
  # 出题时 AI 很容易把"做法"写进材料——"政府出台了……政策""引导……向……转移"
  # "大力发展……新兴产业"。而这些"做法"往往就是评分细则的因果链本身，
  # 于是学生只要复述材料就能拿满分，整班答卷长得一模一样，这道题就废了。
  # （实测踩过：第 28 号存档第 1 份直接拿了 8 分满分。）
  # 打开后程序会做一次**本地核对**（不联网、平时不额外花钱）：
  # 把每条采分点【冒号后的因果链】拿去跟材料原文比，
  # 连续雷同 ≥10 字就判定"答案泄漏"，带着反馈打回重出。
  leak_guard: true
  # 最多重出几轮。2 = 泄漏时重出一次（只在这种情况下多花一次出题调用）；
  # 改 1 = 不重出，只在日志里提示你自己去删材料里的"做法"句。
  leak_retry_rounds: 2

classroom:
  # 每题生成多少份学生答卷。
  # 【当前设为 4】用户要求一次生成 4 份；每跑一轮都要花 API 额度。
  # 正式使用时再改大（一般 40）。
  students: 8
  # 一次请求写几份答卷。
  # 【已固定为 1】每位学生的角色提示词不同，混在一批里写会互相串味、
  # 也会让 AI 把不同水平的答案写得一模一样。改这个不会生效。
  answer_batch: 1
  # 同时最多跑几个请求
  answer_concurrency: 3
  # 学生答卷的随机程度，0~1（智谱上限为 1）。
  # 区分度主要来自"偏离主题的写法"和"逐点要求"，温度太高反而不服从指令
  answer_temperature: 0.85
  # 五个水平档位的人数占比（加起来建议等于 1）
  #
  # ┌ 三档归类 ────────────────────────────────────────────┐
  # │ 完全命中  优秀            = 10%                      │
  # │ 部分命中  良好 + 中等 + 薄弱 = 20% + 30% + 20% = 70% │
  # │ 未命中    很差            = 20%                      │
  # └──────────────────────────────────────────────────────┘
  # 也就是 10 份里大约只有 1 份是接近满分的尖子卷，
  # 7 份是"看着像回事、但总有欠缺"的半对卷，2 份是基本没答对的卷。
  ability_weights:
    优秀: 0.10
    良好: 0.20
    中等: 0.30
    薄弱: 0.20
    很差: 0.20
  # 半对卷的"错误画像"抽取比例（五类各占多少）
  #   浮于表面型：条件和现象都写了，就是推不出因果
  #               例："当地昼夜温差比较大，有利于青稞生长"
  #   似是而非型：条件写对，但因果机制张冠李戴/因果倒置/套路硬套——
  #               听着头头是道，内行一看就错（真实考生最常见的"假会"）
  #   只报结论型：直接报出对作物的好处，中间"为什么"一步不写
  #   术语笼统型：方向对，但通篇大白话，一个专业术语都不出现
  #   半途而止型：写出条件和一个中间环节就收笔，链条差最后一截
  # 说明："优秀"档固定用扎实型，"很差"档固定从浮于表面/半途而止里抽。
  # ⚠ 上面五个名字必须和程序里写的完全一致（一字不差）。
  #   改了名字，这一类就认不出来、会被悄悄丢掉，配置也就白填了。
  style_weights:
    浮于表面型: 0.35
    似是而非型: 0.25
    只报结论型: 0.15
    术语笼统型: 0.10
    半途而止型: 0.15
  # 【答题范围】每位学生只分到池子里的一部分采分点（例如 6 分的题给了 5 个点，
  # 每人只抽 3~4 个点来答），抽不到的整条不写。这是"正确率被按住"的第一道闸。
  # 在抽到的点里，再额外整条漏答的概率（0 表示不额外漏）
  # 很差档按 3 倍计、薄弱档按 2 倍计、中等档按 0.5 倍计
  blank_rate: 0.15
  # ---- 方向红线（防"答到别的方向上去"）----
  # 题目问自然条件，答案里冒出"经济、人口、水能"；问有利条件，
  # 答案里冒出"崎岖、不足、制约"——这类内容一出现，整道题就废了
  # （学生不是在"答得浅"，而是在"乱写"）。
  # 打开后程序会在生成答卷后自动核对，命中就打回重写。
  direction_guard: true
  # 违禁词表（可以自己加减；按题目问法自动选用哪一张）
  #   natural   ：设问问"自然…"且没问"人文"时启用
  #   favorable ：设问问"有利…／优势"且没问"不利"时启用
  #               （"评价有利与不利影响"这类两问的题不会启用，放心）
  forbidden_words:
    natural: [经济, 人口, 劳动力, 市场, 交通, 运输, 政策, 资金,
              水能, 发电, 航运, 城镇化, 产业]
    favorable: [限制, 制约, 不足, 短缺, 匮乏, 缺乏, 不利, 较差,
                崎岖, 陡峭, 贫瘠, 落后, 薄弱, 难以, 无法, 不能]
  # ---- 生成质量闸门（只拦"跑方向"和"写成残句"）----
  # 【2026-09-29 起生成答卷时不再把评分细则发给 AI】（它就是普通考生，
  #  只凭自己的知识作答），所以旧版那套"跟标准答案比对、看有没有抄标准答案"
  #  的判据已经用不上了。这道闸门现在只做两件事：
  #   ① 方向红线：答案里出现违禁词（见上面的 forbidden_words）就打回重写
  #   ② 篇幅：AI 偶尔会把答案压成残句（"3. 黄土。"），低于本档下限一半就打回
  # 关闭后生成会快一点，但偶尔会留下残句或跑方向的答案，不建议关。
  quality_gate: true
  # ---- 篇幅均衡（只防"极端残卷"，不再要求全班写得一样长）----
  # 做法：先算出这一班答卷字数的【中位数】（用中位数而不是平均数，
  #   避免被某一份极端答案带偏），再看每份有没有偏离太多。
  # ⚠ 2026-09-29 起口径放宽：优秀／良好／中等写满、薄弱与很差**本来就写得少**
  #   （见 planner.LENGTH_SPEC），所以"短"不再是问题——这一项现在只拦
  #   "极端残卷"（短于中位数的 25%）和"个别写得过分长"的卷子。
  #   想彻底关掉就设 length_balance: false。
  length_balance: true
  length_min_ratio: 0.25
  length_max_ratio: 1.6
  # 最多改写几轮（0 = 只检查不改写）。每轮只改不合格的那几份，
  # 改完更糟就保留原稿，所以不会越改越差
  regenerate_rounds: 2
  # 本地"硬删硬改"兜底（force_fix）开关。
  # 【默认关闭】它会在卷面上留下断头句、光杆介词这类机器痕迹，
  # 现在改用"让 AI 把那一句改含糊/换个方向重写"。除非 AI 完全不服从指令，
  # 不建议打开。
  force_fix: false
  # 重合度上限 / 连续雷同字数。
  # ⚠ 【2026-09-29 起生成闸门已不再使用这两项】：生成答卷时 AI 看不到评分细则，
  #   不可能"照抄标准答案"，这两组阈值只保留给旧的本地核对函数与自测脚本，
  #   改它们不会影响出卷效果。真要调松紧，请改 prompts/answer_system.txt 里的
  #   角色提示词与篇幅要求。
  # ⚠ "off" 这两个引号不能删！YAML 会把没加引号的 off 当成"关"（布尔值），
  #   于是这一行就被当成无效设置悄悄丢掉了。下面 min_common_chars 同理。
  similarity_thresholds:
    blank: 0.30
    "off": 0.75
    partial: 0.75
  min_common_chars:
    blank: 5
    "off": 7
    partial: 10

grading:
  # AI 阅卷时，同一份答卷独立判定几次（1=最快，3=标准，5=最稳）
  repeats: 3
  # 阅卷温度，0 表示尽量不随机，保证分数稳定
  temperature: 0.0
  # 同时最多判几份
  concurrency: 3

ui:
  window_width: 1080
  window_height: 880
  # 答卷展示用的手写体字体文件（放在 assets 文件夹里）
  # 换字体：把新的 .ttf 放进 assets 文件夹，再把这里改成那个文件名即可。
  # 现在用的是「鸿雷拙书」（免费商用）——笔画有轻重、结构不规整，最像学生自己写的。
  # 备选：LXGWWenKai-Regular.ttf（霞鹜文楷，工整得像印刷体，太"标准答案"了）。
  answer_font: "HongLeiZhuoShu.ttf"
  answer_font_size: 18
  # ---- 手机/网页版的渲染引擎 ----
  # Flet 网页版要在手机浏览器里"画"出界面，底层靠一个 WebAssembly 引擎。
  # 默认的 canvaskit 引擎有 6.9 MB，手机要下载+编译，第一次打开可能要一两分钟。
  # 可选值：
  #   auto      = 自动（等价于 canvaskit，渲染最稳，手机上偏慢）
  #   skwasm    = 轻量引擎（只有 3.4 MB，手机上明显快；偶尔老手机可能显示异常）
  # 电脑端双击 exe 不受这个设置影响。
  web_renderer: "skwasm"
